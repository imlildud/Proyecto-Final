services:
  postgres-adminbd:
    image: postgres:17
    container_name: postgres-adminbd
    restart: always
    environment:
      POSTGRES_USER: admin_bd
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: db_practicas
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-adminbd
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    depends_on:
      - postgres-adminbd

volumes:
  postgres_data: